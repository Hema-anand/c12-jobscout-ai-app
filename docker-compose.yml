services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: jobscout
      POSTGRES_USER: jobscout
      POSTGRES_PASSWORD: jobscout
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+psycopg://jobscout:jobscout@db:5432/jobscout
      LLM_PROVIDER: mock
      MESSAGING_ENABLED: "false"
    ports:
      - "8000:8000"

volumes:
  postgres_data:
